<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">LLSP Demo Videos</title>
  <desc id="desc">Preview card linking to the LLSP demo videos on Google Drive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="825" cy="120" r="180" fill="#0ea5e9" fill-opacity="0.08"/>
  <circle cx="110" cy="470" r="170" fill="#22c55e" fill-opacity="0.08"/>

  <rect x="72" y="70" width="816" height="400" rx="28" fill="#0b1220" fill-opacity="0.9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="72" y="70" width="816" height="12" rx="6" fill="url(#accent)"/>

  <text x="120" y="152" fill="#e5eef8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">VIDEO DEMO</text>
  <text x="120" y="218" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">LLSP Demo Videos</text>
  <text x="120" y="272" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Open the project video folder on Google Drive.</text>

  <g transform="translate(710 214)">
    <circle cx="0" cy="0" r="76" fill="#e2e8f0" fill-opacity="0.1" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="-18,-34 42,0 -18,34" fill="#f8fafc"/>
  </g>

  <rect x="120" y="334" width="282" height="62" rx="31" fill="#f8fafc"/>
  <text x="150" y="374" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Open on Google Drive</text>

  <text x="120" y="444" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="21">Preview image only. Videos open in Drive.</text>
</svg>
