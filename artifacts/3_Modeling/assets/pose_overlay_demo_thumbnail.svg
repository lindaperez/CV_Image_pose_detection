<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Pose Overlay Demo Videos</title>
  <desc id="desc">Preview card linking to local pose overlay demo recordings.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bg2)"/>
  <circle cx="810" cy="118" r="170" fill="#f59e0b" fill-opacity="0.08"/>
  <circle cx="120" cy="455" r="150" fill="#10b981" fill-opacity="0.08"/>

  <rect x="74" y="72" width="812" height="396" rx="28" fill="#0b1220" fill-opacity="0.92" stroke="#334155" stroke-width="2"/>
  <rect x="74" y="72" width="812" height="12" rx="6" fill="url(#accent2)"/>

  <text x="118" y="150" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">POSE OVERLAY DEMO</text>
  <text x="118" y="218" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Live Squat Recordings</text>
  <text x="118" y="272" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Open the saved pose-overlay demo videos from the live squat prototype.</text>

  <g transform="translate(712 212)">
    <circle cx="0" cy="0" r="76" fill="#ffffff" fill-opacity="0.10" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="-18,-34 42,0 -18,34" fill="#f8fafc"/>
  </g>

  <rect x="118" y="334" width="292" height="62" rx="31" fill="#f8fafc"/>
  <text x="150" y="374" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Open Overlay Videos</text>

  <text x="118" y="444" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="21">Qualitative demo recordings with pose overlay and count HUD.</text>
</svg>
